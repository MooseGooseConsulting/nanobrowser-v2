name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            host/pnpm-lock.yaml
      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
      - name: Install host dependencies
        run: pnpm --dir host install --frozen-lockfile
      - name: Typecheck extension
        run: pnpm typecheck
      - name: Test extension and existing invariants
        run: pnpm test
      - name: Typecheck host
        run: pnpm --dir host typecheck
      - name: Test host
        run: pnpm --dir host test
